name: Сборка APK Вокруг (Flutter)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Генерация Android-проекта
        run: flutter create --org ru.around --project-name around_app --platforms android .

      - name: Патч манифеста
        run: python3 patch_manifest.py

      - name: Стабильный ключ подписи
        run: |
          if [ -f android/around.keystore ]; then
            mkdir -p ~/.android
            cp android/around.keystore ~/.android/debug.keystore
            echo "KEY_STABLE=true" >> $GITHUB_ENV
          else
            mkdir -p ~/.android
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore android/around.keystore
            echo "KEY_STABLE=false" >> $GITHUB_ENV
          fi

      - name: Настройка Gradle
        run: |
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m" >> android/gradle.properties

      - name: Зависимости
        run: flutter pub get

      - name: Сборка RELEASE-APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tail -n 120

      - name: Закрепить ключ в репозитории
        if: env.KEY_STABLE == 'false'
        run: |
          git config user.name "around-actions"
          git config user.email "actions@github.com"
          git add -f android/around.keystore
          git commit -m "Закреплён ключ подписи APK"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: around-flutter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
